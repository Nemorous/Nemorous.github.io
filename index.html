<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="Penetration tester, open-source tool developer, and NCL Diamond-tier CTF competitor. PenTest+, CySA+, Security+.">
<meta property="og:url" content="https://anthonystumpf.com/">
<meta property="og:image" content="https://anthonystumpf.com/og.png">
<meta property="og:image:width" content="1200">

<meta name="twitter:title" content="Anthony Stumpf | Offensive Security &amp; AI">

<meta name="twitter:image" content="https://anthonystumpf.com/og.png">
<meta name="theme-color" content="#08090c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#08090c; --bg-2:#0b0e15; --panel:#0e1117; --panel-2:#121722;
  --line:#1d2330; --line-2:#2a3242;
  --text:#f2f4f8; --muted:#9aa3b2; --dim:#6b7486;
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.12); --accent-line:rgba(59,130,246,.35);
  --ok:#22c55e; --warn:#f59e0b;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:12px; --max:1160px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% 10%,rgba(37,70,140,.18),transparent 60%),
             radial-gradient(800px 600px at 90% 60%,rgba(30,58,120,.14),transparent 60%);}
a{color:inherit}
img{max-width:100%}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding-inline:24px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,9,12,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:72px;max-width:1440px;margin:0 auto;padding-inline:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:.01em;flex-shrink:0}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line-2)}
nav.main{display:flex;align-items:center;gap:4px;margin-left:auto}
nav.main a{position:relative;padding:8px 12px;font-size:14px;color:var(--muted);text-decoration:none;border-radius:6px;white-space:nowrap;transition:color .15s}
nav.main a:hover{color:var(--text)}
nav.main a.active{color:var(--accent)}
nav.main a.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-14px;height:2px;background:var(--accent);border-radius:2px}
nav.main .sep{width:1px;height:28px;background:var(--line-2);margin:0 12px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:500;font-size:14px;padding:10px 22px;border-radius:7px;border:0;cursor:pointer;transition:background .15s}
.cta:hover{background:#2f6fe0}
.menu-btn{display:none;margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--text);border-radius:8px;width:40px;height:40px;cursor:pointer}
@media (max-width:1180px){
  nav.main,.bar>.cta{display:none}
  .menu-btn{display:grid;place-items:center}
  nav.main.open{display:flex;flex-direction:column;align-items:stretch;position:absolute;top:72px;left:0;right:0;background:var(--bg-2);border-bottom:1px solid var(--line);padding:12px 16px 20px;gap:2px}
  nav.main.open .sep{width:auto;height:1px;margin:8px 0}
  nav.main.open a.active::after{display:none}
  nav.main.open .cta-m{display:flex}
}
.cta-m{display:none;justify-content:center;margin-top:10px}

/* ---------- shared ---------- */
section{position:relative;z-index:1;border-top:1px solid var(--line);padding-block:96px}
section:first-of-type{border-top:0}
@media (max-width:600px){section{padding-block:64px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:8px 14px;border-radius:999px}
.eyebrow svg{width:14px;height:14px;flex-shrink:0}
.eyebrow.plain{background:none;border:0;padding:0}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.head{text-align:center;max-width:720px;margin:0 auto 56px;display:flex;flex-direction:column;align-items:center;gap:18px}
.head h2{font-size:clamp(32px,4.5vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.head p{color:var(--muted);font-size:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.icon{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--muted);flex-shrink:0}
.icon.blue{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.icon svg{width:22px;height:22px}
.tag{display:inline-block;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line-2);padding:4px 10px;border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.badge{font:600 12px/1 var(--mono);color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line-2);padding:7px 10px;border-radius:6px;white-space:nowrap}
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- hero ---------- */
.hero{padding-block:110px 72px}
.hero .wrap{max-width:1000px}
.hero h1{font:700 clamp(52px,9vw,96px)/1.02 var(--serif);letter-spacing:-.015em;margin:32px 0 28px}
.hero .lede{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:62ch;line-height:1.6}
.stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.stat{display:inline-flex;align-items:center;gap:10px;font-size:14.5px;padding:11px 16px;border-radius:8px;background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.22)}
.stat svg{width:16px;height:16px;color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:18px;margin-top:52px}
.btn{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:15px;padding:14px 34px;border-radius:9px;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s}
.btn svg{width:17px;height:17px;transition:transform .15s}
.btn:hover svg{transform:translateX(3px)}
.btn[download]:hover svg{transform:translateY(2px)}
.btn.light{background:#f3f4f6;color:#0b0d12;border:1px solid #f3f4f6}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid #4a5160}
.btn.ghost:hover{border-color:#7a8394}
.scroll-cue{display:flex;justify-content:center;margin-top:56px;color:var(--accent);opacity:.7}
.hero h1,.hero .lede,.stats,.actions{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero .lede{animation-delay:.08s}.stats{animation-delay:.16s}.actions{animation-delay:.24s}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

/* focus cards */
.focus{padding:24px;display:flex;flex-direction:column;gap:18px;transition:border-color .2s,transform .2s}
.focus:hover{border-color:var(--accent-line);transform:translateY(-3px)}
.focus .top{display:flex;justify-content:space-between;align-items:flex-start}
.focus .chev{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--muted)}
.focus h3{font-size:19px;line-height:1.35}
.focus p{color:var(--muted);font-size:14.5px;margin-top:8px}

/* skills */
.skill-group{padding:26px}
.skill-group h3{display:flex;align-items:center;gap:12px;font-size:17px;margin-bottom:18px}
.skill-group h3 .icon{width:38px;height:38px}
.skill-group h3 .icon svg{width:18px;height:18px}

/* timeline */
.timeline{position:relative;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.timeline::before{content:"";position:absolute;left:23px;top:12px;bottom:-40px;width:2px;background:var(--line-2)}
.t-item{display:grid;grid-template-columns:48px 1fr;gap:24px;align-items:start}
.t-node{position:relative;z-index:1;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#1b1f28;border:3px solid #2b3140;color:var(--muted)}
.t-node svg{width:18px;height:18px}
.t-card{padding:30px 32px}
.t-row{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%;padding:0}
.t-row h3{font-size:clamp(19px,2.4vw,23px);letter-spacing:-.01em}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:8px;color:var(--muted);font-size:15px}
.t-meta .d{width:4px;height:4px;border-radius:50%;background:var(--dim)}
.t-meta .badge{font-family:var(--sans);font-weight:400;font-size:12.5px}
.t-toggle{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--muted);flex-shrink:0;transition:transform .2s}
.t-card.open .t-toggle{transform:rotate(180deg)}
.t-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.t-card.open .t-body{grid-template-rows:1fr}
.t-body>div{overflow:hidden}
.t-body ul{margin:22px 0 0;padding:20px 0 0 18px;border-top:1px solid var(--line);color:var(--muted);display:flex;flex-direction:column;gap:8px}
.t-body li::marker{color:var(--accent)}
@media (max-width:600px){.t-item{grid-template-columns:1fr}.t-node,.timeline::before{display:none}.t-card{padding:22px}}

/* certifications */
.cert-head{display:flex;align-items:center;gap:14px;padding-bottom:22px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.cert-head h3{font-size:24px}
.cert-head svg{width:24px;height:24px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.pill.ok{color:var(--ok);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.pill.warn{color:var(--warn);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3)}
.cert{position:relative;overflow:hidden;padding:24px;display:flex;flex-direction:column;gap:6px}
.cert::after{content:"";position:absolute;right:-60px;top:-60px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(255,255,255,.04);box-shadow:0 0 0 22px rgba(255,255,255,.012),0 0 0 44px rgba(255,255,255,.01)}
.cert .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.cert h4{margin:0;font-size:18px}
.cert .issuer{color:var(--muted);font-size:14.5px}
.cert p{color:var(--dim);font-size:14.5px;margin-top:10px}
.cert-block+.cert-block{margin-top:72px}

/* ncl */
a.stat{text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
a.stat:hover{border-color:var(--accent);background:rgba(59,130,246,.1)}
.ncl-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
@media (max-width:760px){.ncl-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ncl-sum .card{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.ncl-sum b{font:700 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.ncl-sum small,.ncl-p small{font-size:.5em;margin-left:1px;vertical-align:super;color:var(--muted)}
.ncl-sum span{color:var(--muted);font-size:14px}
.ncl-season{min-width:0;padding:22px;display:flex;flex-direction:column;gap:12px}
.ncl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px}
.ncl-h h3{font-size:18px}
.pill.dia{display:inline-flex;align-items:center;gap:6px;color:#7cc0ff;background:rgba(47,134,224,.12);border:1px solid rgba(47,134,224,.35)}
.ncl-row{min-width:0;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:9px;border:1px solid var(--line-2);background:rgba(255,255,255,.02);text-decoration:none;transition:border-color .15s,background .15s}
.ncl-row:hover{border-color:var(--accent-line);background:rgba(59,130,246,.06)}
.ncl-top{display:flex;justify-content:space-between;align-items:baseline}
.ncl-g{font-weight:600;font-size:15px}
.ncl-p{font:700 24px/1 var(--serif);font-variant-numeric:tabular-nums}
.ncl-bar{height:5px;border-radius:3px;background:#1a2030;overflow:hidden}
.ncl-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#1d4ed8,#3b82f6 70%,#7cc0ff)}
.ncl-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.ncl-f>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ncl-link{display:inline-flex;align-items:center;gap:4px;color:#60a5fa;white-space:nowrap}
.ncl-link svg{width:13px;height:13px}

/* projects */
.proj{padding:24px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));text-decoration:none;transition:border-color .2s,transform .2s}
.proj:hover{border-color:var(--accent-line);transform:translateY(-3px)}
.proj .top{display:flex;justify-content:space-between;align-items:flex-start}
.proj .arrow{color:var(--muted);width:18px;height:18px}
.proj h3{font-size:20px;line-height:1.35;margin-top:6px}
.proj p{color:var(--muted);font-size:14.5px;flex:1}
.proj .tags{padding-top:18px;border-top:1px solid var(--line)}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7.5fr);gap:40px;max-width:1024px;margin:0 auto;align-items:start}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.c-info{padding:26px;background:linear-gradient(160deg,var(--panel-2),var(--panel))}
.c-info h3{font-size:18px;margin-bottom:24px}
.c-list{display:flex;flex-direction:column;gap:16px}
.c-list a,.c-list span.c{display:flex;align-items:center;gap:16px;color:var(--muted);text-decoration:none;font-size:15px;word-break:break-word}
.c-list a:hover{color:var(--text)}
.c-list .icon{width:44px;height:44px;border:0;background:rgba(255,255,255,.06)}
.c-list .icon svg{width:19px;height:19px}
form{padding:32px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
form .full{grid-column:1/-1}
@media (max-width:520px){form{grid-template-columns:1fr;padding:22px}}
label{display:block;font-size:14.5px;font-weight:500;margin-bottom:10px}
input,textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:#07080b;border:1px solid var(--line-2);border-radius:7px;padding:10px 16px}
textarea{min-height:104px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
form .btn{width:100%;justify-content:center}
.form-note{font-size:14px;color:var(--muted);text-align:center}
.form-note.ok{color:var(--ok)}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding-block:40px;text-align:center;color:var(--muted);background:linear-gradient(90deg,#0e1420,#050608)}

/* ---------- sub pages ---------- */
.page-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:740px;margin:0 auto 64px}
.page-hero .icon{border-radius:50%;width:52px;height:52px}
.page-hero h1{font:700 clamp(38px,6vw,56px)/1.1 var(--serif);letter-spacing:-.01em}
.page-hero p{color:var(--muted);font-size:18px}
.page-hero .rule{width:96px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#22d3ee)}
.edu{display:grid;grid-template-columns:64px 1fr;gap:32px;padding:32px;max-width:896px;margin:0 auto}
.edu+.edu{margin-top:32px}
.edu .icon{width:64px;height:64px;color:var(--accent)}
.edu .icon svg{width:30px;height:30px}
.edu .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.edu h2{font-size:24px}
.edu .deg{color:var(--accent);font-size:18px;margin-top:10px}
.edu .field{color:var(--muted);font-size:14.5px;margin-top:2px}
.edu p.desc{color:var(--muted);margin-top:18px}
.edu .kc{font:600 12px/1 var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:24px 0 12px}
.edu .badge{color:var(--text)}
@media (max-width:600px){.edu{grid-template-columns:1fr;gap:18px;padding:22px}}
.honors{max-width:896px;margin:64px auto 0}
.honors h2{font-size:22px;margin-bottom:20px}
.honor{display:flex;align-items:center;gap:16px;padding:18px 20px}
.honor .icon{width:40px;height:40px;color:var(--accent)}

.venture{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.venture+.venture{margin-top:96px}
@media (max-width:900px){.venture{grid-template-columns:1fr;gap:32px}}
.venture h2{font:700 clamp(34px,5vw,50px)/1.08 var(--serif);margin:22px 0 22px}
.venture .lede{color:var(--muted);font-size:18px;line-height:1.65}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px}
@media (max-width:480px){.feat{grid-template-columns:1fr}}
.feat div{display:flex;align-items:center;gap:12px;font-size:14.5px;padding:12px 14px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--line-2)}
.feat svg{width:16px;height:16px;color:var(--accent);flex-shrink:0}
.terminal{background:#05070a;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;font:13.5px/1.75 var(--mono)}
.terminal .tb{display:flex;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line);background:#0b0e14}
.terminal .tb i{width:11px;height:11px;border-radius:50%;background:#2a3140}
.terminal pre{margin:0;padding:22px;color:#a9b4c6;white-space:pre-wrap;word-break:break-word}
.terminal .p{color:var(--accent)}.terminal .g{color:var(--ok)}.terminal .y{color:var(--warn)}.terminal .r{color:#f87171}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:40px}
@media (max-width:800px){.two{grid-template-columns:1fr}}
.two .card{padding:32px}
.two h3{font-size:22px;margin-bottom:18px}
.two p{color:var(--muted)}
.two p+p{margin-top:14px}
.two ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;color:var(--muted)}
.two li{display:flex;gap:12px}
.two li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:10px;flex-shrink:0}

.post{overflow:hidden;display:flex;flex-direction:column}
.post .cover{position:relative;aspect-ratio:16/8;max-width:100%;background:
  linear-gradient(135deg,rgba(59,130,246,.18),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px),

function nclView() {
  const rows = SITE.ncl, seasons = [...new Set(rows.map(r => r[0]))];
  const best = Math.max(...rows.map(r => r[2]));
  const top = rows.filter(r => r[2] >= 95).length;
  const shield = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2 4 5.5v6c0 5 3.4 9.3 8 10.5 4.6-1.2 8-5.5 8-10.5v-6L12 2Z" fill="#2f86e0"/><path d="M6 9.5 18 6.5M6 13l12-3" stroke="rgba(255,255,255,.35)" stroke-width="1.6"/></svg>`;
  return `<section id="ncl"><div class="wrap">
    ${head("National Cyber League", "trophy", "Competition Record", "Diamond tier in every NCL game since Spring 2023. Each result links to its official Cyber Skyline scorecard.")}
    <div class="ncl-sum">
      <div class="card"><b>${rows.length}/${rows.length}</b><span>Games at Diamond tier</span></div>
      <div class="card"><b>${best}<small>th</small></b><span>Best percentile overall</span></div>
      <div class="card"><b>${top}</b><span>Games at 95th percentile or higher</span></div>
      <div class="card"><b>${seasons.length}</b><span>Consecutive seasons</span></div>
    </div>
    <div class="grid g3 ncl-grid">${seasons.map(se => `
      <div class="card ncl-season"><div class="ncl-h"><h3>${esc(se)}</h3><span class="pill dia">${shield}Diamond</span></div>
        ${rows.filter(r => r[0] === se).map(([, g, pct, team, url]) => `
        <a class="ncl-row" ${ext(url)} aria-label="${esc(se)} ${esc(g)} Game scorecard, ${pct}th percentile">
          <div class="ncl-top"><span class="ncl-g">${esc(g)} Game</span><span class="ncl-p">${pct}<small>th</small></span></div>
          <div class="ncl-bar"><i style="width:${pct}%"></i></div>
          <div class="ncl-f"><span title="${esc(team || "Solo")}">${team ? esc(team) : "Solo"}</span><span class="ncl-link">Scorecard ${ic("arrowUR")}</span></div>
        </a>`).join("")}
      </div>`).join("")}</div>
  </div></section>`;
}

/* ---------------------------- router ---------------------------- */
const app = document.getElementById("app");
let currentPage = null;
function route() {
  const h = (location.hash || "#home").slice(1);
  const page = PAGES[h] ? h : "home";
  if (page !== currentPage) {
    currentPage = page;
    app.innerHTML = page === "education" ? educationView() : page === "ventures" ? venturesView() : page === "writeups" ? writeupsView() : homeView();
    renderNav(page);
    bind();
  }
  document.getElementById("nav").classList.remove("open");
  if (page === "home" && h !== "home") {
    const el = document.getElementById(h);
    if (el) requestAnimationFrame(() => el.scrollIntoView());
  } else window.scrollTo(0, 0);
}
function bind() {
  document.querySelectorAll(".t-row").forEach(b => b.addEventListener("click", () => {
    const card = b.closest(".t-card"); card.classList.toggle("open");
    b.setAttribute("aria-expanded", card.classList.contains("open"));
  }));
  const f = document.getElementById("contact-form");
  if (f) f.addEventListener("submit", async ev => {
    ev.preventDefault();
    const note = document.getElementById("form-note");
    note.hidden = false; note.className = "full form-note";
    if (!f.checkValidity()) { note.textContent = "Add your first name, a valid email, and a message, then send again."; return; }
    const ep = SITE.contact.formEndpoint;
    if (!ep) { note.textContent = "The contact form isn't connected yet. Use the links on the left to reach out."; return; }
    try {
      const r = await fetch(ep, { method: "POST", headers: { Accept: "application/json" }, body: new FormData(f) });
      if (!r.ok) throw 0;
      f.reset(); note.className = "full form-note ok"; note.textContent = "Message sent. I'll get back to you soon.";
    } catch { note.textContent = "Sending failed. Check your connection or use the links on the left."; }
  });
}
document.getElementById("brand-name").textContent = SITE.name;
document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${SITE.footer}`;
document.getElementById("menu-btn").addEventListener("click", e => {
  const n = document.getElementById("nav"); n.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", n.classList.contains("open"));
});
addEventListener("hashchange", route);
route();
</script>
